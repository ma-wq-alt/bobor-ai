<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>БОБОР-AI</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', Arial, sans-serif; background: #0f0c29; color: #fff; height: 100vh; display: flex; }
  
  /* ЭКРАН ВХОДА */
  #auth-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #0f0c29, #302b63); display: flex; justify-content: center; align-items: center; z-index: 100; }
  .auth-box { background: rgba(30, 30, 60, 0.9); padding: 30px; border-radius: 20px; box-shadow: 0 0 30px rgba(124, 58, 237, 0.5); width: 350px; text-align: center; }
  .auth-box h2 { margin-bottom: 20px; color: #c4b5fd; }
  
  .tabs { display: flex; margin-bottom: 20px; border-bottom: 1px solid #5b21b6; }
  .tab { flex: 1; padding: 10px; cursor: pointer; color: #a78bfa; }
  .tab.active { color: #fff; border-bottom: 2px solid #7c3aed; font-weight: bold; }
  
  .tab-content { display: none; }
  .tab-content.active { display: block; }

  .auth-box input { width: 100%; padding: 12px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #5b21b6; background: #1a1a3a; color: #fff; }
  .auth-box button { width: 100%; padding: 12px; background: #7c3aed; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; margin-bottom: 10px; }
  .auth-box button:hover { background: #6d28d9; }
  .auth-box p { font-size: 14px; color: #f87171; margin-top: 10px; }

  /* ОСНОВНОЙ ИНТЕРФЕЙС */
  #main-app { display: none; width: 100%; height: 100vh; }
  .sidebar { width: 260px; background: #15132b; display: flex; flex-direction: column; border-right: 1px solid #2a2550; }
  .sidebar-header { padding: 20px; border-bottom: 1px solid #2a2550; }
  .sidebar-header button { width: 100%; padding: 10px; background: #7c3aed; border: none; border-radius: 8px; color: #fff; cursor: pointer; font-weight: bold; }
  .chat-list { flex: 1; overflow-y: auto; padding: 10px; }
  .chat-item { padding: 12px; margin-bottom: 5px; border-radius: 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #a78bfa; }
  .chat-item:hover, .chat-item.active { background: #2a2550; color: #fff; }
  .user-info { padding: 15px; border-top: 1px solid #2a2550; display: flex; justify-content: space-between; align-items: center; font-size: 14px; }

  .chat-area { flex: 1; display: flex; flex-direction: column; background: #0f0c29; }
  .messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; }
  .msg { max-width: 80%; padding: 12px 16px; border-radius: 16px; line-height: 1.5; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #7c3aed; }
  .msg.bot { align-self: flex-start; background: #2a2550; }
  .msg img { max-width: 100%; border-radius: 8px; margin-top: 8px; border: 1px solid #5b21b6; }
  
  .input-panel { padding: 15px; background: #15132b; border-top: 1px solid #2a2550; }
  .mode-selector { display: flex; gap: 10px; margin-bottom: 10px; }
  .mode-btn { padding: 6px 15px; border-radius: 20px; border: 1px solid #5b21b6; background: transparent; color: #a78bfa; cursor: pointer; font-size: 12px; }
  .mode-btn.active { background: #5b21b6; color: #fff; }
  .input-row { display: flex; gap: 10px; }
  .input-row input[type="text"] { flex: 1; padding: 12px; border-radius: 8px; border: 1px solid #5b21b6; background: #1a1a3a; color: #fff; }
  .input-row button { padding: 0 20px; background: #7c3aed; border: none; border-radius: 8px; color: #fff; cursor: pointer; font-weight: bold; }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen">
  <div class="auth-box">
    <h2>🦫 БОБОР-AI</h2>
    
    <div class="tabs">
      <div class="tab active" onclick="switchTab('pass')">Пароль</div>
      <div class="tab" onclick="switchTab('email')">Вход по коду</div>
    </div>

    <!-- Вкладка: Вход по паролю -->
    <div id="tab-pass" class="tab-content active">
      <input type="text" id="loginUser" placeholder="Ник или Email">
      <input type="password" id="loginPass" placeholder="Пароль">
      <button onclick="login()">Войти</button>
      <button onclick="register()" style="background: #4c1d95;">Регистрация</button>
    </div>

    <!-- Вкладка: Вход по коду на почту -->
    <div id="tab-email" class="tab-content">
      <input type="email" id="emailInput" placeholder="Твоя почта">
      <button onclick="requestCode()" id="btnRequest">Получить код</button>
      
      <div id="codeBlock" style="display: none; margin-top: 15px;">
        <input type="text" id="codeInput" placeholder="Введи 6-значный код">
        <button onclick="verifyCode()">Войти</button>
      </div>
    </div>

    <p id="authMsg"></p>
  </div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС (без изменений) -->
<div id="main-app">
  <div class="sidebar">
    <div class="sidebar-header">
      <button onclick="createNewChat()">+ Новый чат</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="user-info">
      <span id="currentUser"></span>
      <button onclick="logout()" style="background: none; border: none; color: #f87171; cursor: pointer; font-weight: bold;">Выйти</button>
    </div>
  </div>
  <div class="chat-area">
    <div class="messages" id="messages"></div>
    <div class="input-panel">
      <div class="mode-selector">
        <button class="mode-btn active" data-mode="normal" onclick="setMode('normal')">Обычный</button>
        <button class="mode-btn" data-mode="weak" onclick="setMode('weak')">Слабый</button>
        <button class="mode-btn" data-mode="strong" onclick="setMode('strong')">Сильный</button>
      </div>
      <div class="input-row">
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
        <button onclick="document.getElementById('fileInput').click()" style="background: #4c1d95; padding: 0 15px;">📎</button>
        <input type="text" id="messageInput" placeholder="Напиши сообщение..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
  let token = localStorage.getItem('token');
  let currentUser = localStorage.getItem('username');
  let currentRole = localStorage.getItem('role');
  let currentChatId = null;
  let currentMode = 'normal';
  let selectedFile = null;

  // --- ЛОГИКА ВКЛАДОК ---
  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    if (tab === 'pass') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('tab-pass').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('tab-email').classList.add('active');
    }
    document.getElementById('authMsg').textContent = '';
  }

  // --- ОБЫЧНЫЙ ВХОД / РЕГИСТРАЦИЯ ---
  async function login() {
    const username = document.getElementById('loginUser').value;
    const password = document.getElementById('loginPass').value;
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token); localStorage.setItem('username', data.username); localStorage.setItem('role', data.role);
      initApp();
    } else { document.getElementById('authMsg').textContent = data.error; }
  }

  async function register() {
    const username = document.getElementById('loginUser').value;
    const password = document.getElementById('loginPass').value;
    const res = await fetch('/api/register', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok) alert(`Аккаунт создан! Роль: ${data.role}. Теперь войдите.`);
    else document.getElementById('authMsg').textContent = data.error;
  }

  // --- ВХОД ПО КОДУ ---
  async function requestCode() {
    const email = document.getElementById('emailInput').value;
    const res = await fetch('/api/send-code', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById('btnRequest').style.display = 'none';
      document.getElementById('codeBlock').style.display = 'block';
      document.getElementById('authMsg').textContent = data.message;
      document.getElementById('authMsg').style.color = '#34d399';
    } else { document.getElementById('authMsg').textContent = data.error; }
  }

  async function verifyCode() {
    const email = document.getElementById('emailInput').value;
    const code = document.getElementById('codeInput').value;
    const res = await fetch('/api/verify-code', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, code })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token); localStorage.setItem('username', data.username); localStorage.setItem('role', data.role);
      initApp();
    } else { document.getElementById('authMsg').textContent = data.error; }
  }

  function logout() {
    localStorage.clear();
    location.reload();
  }

  // --- ИНИЦИАЛИЗАЦИЯ ---
  function initApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'flex';
    document.getElementById('currentUser').textContent = currentUser + (currentRole === 'admin' ? ' 👑' : '');
    loadChats();
  }

  if (token) initApp();

  // ... (ЛОГИКА ЧАТОВ И ОТПРАВКИ СООБЩЕНИЙ БЕЗ ИЗМЕНЕНИЙ, КАК В ПРЕДЫДУЩЕМ КОДЕ) ...
  async function loadChats() {
    const res = await fetch('/api/chats', { headers: { 'Authorization': `Bearer ${token}` } });
    const chats = await res.json();
    const list = document.getElementById('chatList');
    list.innerHTML = '';
    chats.forEach(chat => {
      const div = document.createElement('div');
      div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
      div.textContent = chat.title || 'Без названия';
      div.onclick = () => openChat(chat.id);
      list.appendChild(div);
    });
  }

  async function createNewChat() {
    const res = await fetch('/api/chats', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
    const data = await res.json();
    currentChatId = data.chatId; loadChats();
    document.getElementById('messages').innerHTML = '';
  }

  async function openChat(chatId) {
    currentChatId = chatId; loadChats();
    const res = await fetch(`/api/chats/${chatId}/messages`, { headers: { 'Authorization': `Bearer ${token}` } });
    const msgs = await res.json();
    const container = document.getElementById('messages'); container.innerHTML = '';
    msgs.forEach(m => addMessageToUI(m.content, m.role === 'user' ? 'user' : 'bot', m.image_url));
  }

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
  }

  function handleFileSelect(event) {
    selectedFile = event.target.files[0];
    if (selectedFile) document.getElementById('messageInput').placeholder = `Фото: ${selectedFile.name}`;
  }

  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if ((!text && !selectedFile) || !currentChatId) return;

    addMessageToUI(text || '📷 Фото', 'user');
    const formData = new FormData();
    formData.append('message', text); formData.append('mode', currentMode);
    if (selectedFile) formData.append('image', selectedFile);

    input.value = ''; selectedFile = null; document.getElementById('fileInput').value = '';
    input.placeholder = 'Напиши сообщение...';

    try {
      const res = await fetch(`/api/chats/${currentChatId}/message`, {
        method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData
      });
      const data = await res.json();
      if (res.ok) { addMessageToUI(data.reply, 'bot', data.imageUrl); loadChats(); }
      else { addMessageToUI('Ошибка: ' + data.error, 'bot'); }
    } catch (err) { addMessageToUI('Ошибка соединения', 'bot'); }
  }

  function addMessageToUI(text, sender, imageUrl = null) {
    const container = document.getElementById('messages');
    const div = document.createElement('div'); div.className = `msg ${sender}`;
    if (text) {
      const textNode = document.createElement('div'); textNode.textContent = text; div.appendChild(textNode);
    }
    if (imageUrl && imageUrl.startsWith('http')) {
      const img = document.createElement('img'); img.src = imageUrl; div.appendChild(img);
    }
    container.appendChild(div); container.scrollTop = container.scrollHeight;
  }
</script>
</body>
</html>
