<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БОБОР-AI</title>
<style>
  :root {
    --bg-color: #0f0c29;
    --sidebar-bg: #15132b;
    --chat-bg: #1a1635;
    --primary: #7c3aed;
    --primary-hover: #6d28d9;
    --text-main: #f8fafc;
    --text-muted: #a78bfa;
    --border: #2a2550;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
  body { background: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

  /* ЭКРАН ВХОДА */
  #auth-screen { position: fixed; inset: 0; background: linear-gradient(135deg, #0f0c29, #302b63); display: flex; justify-content: center; align-items: center; z-index: 100; transition: opacity 0.3s; }
  .auth-box { background: rgba(30, 30, 60, 0.7); backdrop-filter: blur(10px); padding: 40px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.5); width: 380px; text-align: center; border: 1px solid rgba(167, 139, 250, 0.2); }
  .auth-box h2 { margin-bottom: 25px; font-size: 28px; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
  
  .tabs { display: flex; margin-bottom: 25px; background: rgba(0,0,0,0.2); border-radius: 12px; padding: 4px; }
  .tab { flex: 1; padding: 10px; cursor: pointer; color: var(--text-muted); border-radius: 8px; transition: 0.2s; font-weight: 600; }
  .tab.active { color: #fff; background: var(--primary); box-shadow: 0 2px 10px rgba(124, 58, 237, 0.4); }
  
  .tab-content { display: none; animation: fadeIn 0.3s; }
  .tab-content.active { display: block; }

  .auth-box input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: #fff; font-size: 15px; outline: none; transition: 0.2s; }
  .auth-box input:focus { border-color: var(--primary); }
  .auth-box button { width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: 12px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
  .auth-box button:hover { background: var(--primary-hover); transform: translateY(-1px); }
  .auth-msg { font-size: 14px; color: #f87171; margin-top: 10px; min-height: 20px; }

  /* ОСНОВНОЙ ИНТЕРФЕЙС */
  #main-app { display: none; width: 100%; height: 100vh; animation: fadeIn 0.4s; }
  
  /* САЙДБАР */
  .sidebar { width: 280px; background: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .sidebar-header { padding: 20px; }
  .sidebar-header button { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 12px; color: #fff; cursor: pointer; font-weight: bold; font-size: 15px; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; }
  .sidebar-header button:hover { background: var(--primary-hover); }
  .chat-list { flex: 1; overflow-y: auto; padding: 0 10px 10px 10px; }
  .chat-list::-webkit-scrollbar { width: 5px; }
  .chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  .chat-item { padding: 14px; margin-bottom: 4px; border-radius: 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); transition: 0.2s; font-size: 14px; }
  .chat-item:hover { background: rgba(124, 58, 237, 0.1); color: #fff; }
  .chat-item.active { background: rgba(124, 58, 237, 0.2); color: #fff; font-weight: 600; border-left: 3px solid var(--primary); }
  .user-info { padding: 15px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 14px; background: rgba(0,0,0,0.2); }
  .logout-btn { background: none; border: none; color: #f87171; cursor: pointer; font-weight: 600; }

  /* ЧАТ */
  .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); }
  .messages { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; scroll-behavior: smooth; }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 5px; }
  
  .msg-row { display: flex; gap: 15px; max-width: 85%; animation: slideUp 0.3s ease; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; flex-shrink: 0; }
  .msg-row.bot .avatar { background: rgba(124, 58, 237, 0.2); border: 1px solid var(--primary); }
  .msg-row.user .avatar { background: #4c1d95; border: 1px solid #8b5cf6; }
  
  .msg-content { padding: 14px 18px; border-radius: 16px; line-height: 1.6; font-size: 15px; word-wrap: break-word; }
  .msg-row.bot .msg-content { background: rgba(30, 30, 60, 0.9); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg-row.user .msg-content { background: var(--primary); border-top-right-radius: 4px; color: #fff; box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); }
  .msg-content img { max-width: 100%; border-radius: 10px; margin-top: 10px; border: 1px solid var(--border); display: block; }

  /* ПАНЕЛЬ ВВОДА */
  .input-panel { padding: 20px 30px; background: var(--chat-bg); border-top: 1px solid rgba(255,255,255,0.05); }
  .mode-selector { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
  .mode-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-size: 13px; transition: 0.2s; }
  .mode-btn:hover { background: rgba(124, 58, 237, 0.1); color: #fff; }
  .mode-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  
  .input-row { display: flex; gap: 12px; background: rgba(30, 30, 60, 0.8); padding: 10px; border-radius: 16px; border: 1px solid var(--border); transition: 0.2s; align-items: center; }
  .input-row:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2); }
  .input-row input[type="text"] { flex: 1; background: transparent; border: none; color: #fff; font-size: 16px; outline: none; padding: 5px; }
  .action-btn { background: var(--primary); border: none; border-radius: 10px; color: #fff; width: 42px; height: 42px; display: flex; justify-content: center; align-items: center; cursor: pointer; transition: 0.2s; font-size: 18px; }
  .action-btn:hover { background: var(--primary-hover); transform: scale(1.05); }
  .attach-btn { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 0 10px; transition: 0.2s; }
  .attach-btn:hover { color: #fff; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen">
  <div class="auth-box">
    <h2>🦫 БОБОР-AI</h2>
    
    <div class="tabs">
      <div class="tab active" onclick="switchTab('pass')">Пароль</div>
      <div class="tab" onclick="switchTab('email')">Код на почту</div>
    </div>

    <div id="tab-pass" class="tab-content active">
      <input type="text" id="loginUser" placeholder="Ник или Email">
      <input type="password" id="loginPass" placeholder="Пароль">
      <button onclick="login()">Войти</button>
    </div>

    <div id="tab-email" class="tab-content">
      <input type="email" id="emailInput" placeholder="Твоя почта">
      <button onclick="requestCode()" id="btnRequest">Получить код</button>
      
      <div id="codeBlock" style="display: none; margin-top: 15px;">
        <input type="text" id="codeInput" placeholder="Введи 6-значный код" style="text-align: center; letter-spacing: 5px; font-size: 20px;">
        <button onclick="verifyCode()">Войти</button>
      </div>
    </div>

    <p id="authMsg" class="auth-msg"></p>
  </div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
<div id="main-app">
  <div class="sidebar">
    <div class="sidebar-header">
      <button onclick="createNewChat()">+ Новый чат</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="user-info">
      <span id="currentUser" style="font-weight: 600;"></span>
      <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>
  </div>
  
  <div class="chat-area">
    <div class="messages" id="messages">
      <!-- Приветствие -->
      <div class="msg-row bot">
        <div class="avatar">🦫</div>
        <div class="msg-content">Привет! Я Бобор-AI. Чем могу помочь? Можешь попросить меня нарисовать картинку или скинуть фото.</div>
      </div>
    </div>
    
    <div class="input-panel">
      <div class="mode-selector">
        <button class="mode-btn" data-mode="weak" onclick="setMode('weak')">Слабый</button>
        <button class="mode-btn active" data-mode="normal" onclick="setMode('normal')">Обычный</button>
        <button class="mode-btn" data-mode="strong" onclick="setMode('strong')">Сильный</button>
      </div>
      <div class="input-row">
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
        <button class="attach-btn" onclick="document.getElementById('fileInput').click()" title="Прикрепить фото">📎</button>
        <input type="text" id="messageInput" placeholder="Напиши сообщение Бобору..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="action-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
  let token = localStorage.getItem('token');
  let currentUser = localStorage.getItem('username');
  let currentRole = localStorage.getItem('role');
  let currentChatId = null;
  let currentMode = 'normal';
  let selectedFile = null;

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    if (tab === 'pass') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('tab-pass').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('tab-email').classList.add('active');
    }
    document.getElementById('authMsg').textContent = '';
  }

  async function login() {
    const username = document.getElementById('loginUser').value;
    const password = document.getElementById('loginPass').value;
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token); localStorage.setItem('username', data.username); localStorage.setItem('role', data.role);
      initApp();
    } else { document.getElementById('authMsg').textContent = data.error; }
  }

  async function requestCode() {
    const email = document.getElementById('emailInput').value;
    if (!email) return document.getElementById('authMsg').textContent = 'Введите почту';
    const res = await fetch('/api/send-code', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById('btnRequest').style.display = 'none';
      document.getElementById('codeBlock').style.display = 'block';
      document.getElementById('authMsg').style.color = '#34d399';
      document.getElementById('authMsg').textContent = data.message;
    } else { 
      document.getElementById('authMsg').style.color = '#f87171';
      document.getElementById('authMsg').textContent = data.error; 
    }
  }

  async function verifyCode() {
    const email = document.getElementById('emailInput').value;
    const code = document.getElementById('codeInput').value;
    const res = await fetch('/api/verify-code', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, code })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token); localStorage.setItem('username', data.username); localStorage.setItem('role', data.role);
      initApp();
    } else { 
      document.getElementById('authMsg').style.color = '#f87171';
      document.getElementById('authMsg').textContent = data.error; 
    }
  }

  function logout() {
    localStorage.clear();
    location.reload();
  }

  function initApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'flex';
    document.getElementById('currentUser').textContent = currentUser + (currentRole === 'admin' ? ' 👑' : '');
    loadChats();
  }

  if (token) initApp();

  async function loadChats() {
    const res = await fetch('/api/chats', { headers: { 'Authorization': `Bearer ${token}` } });
    const chats = await res.json();
    const list = document.getElementById('chatList');
    list.innerHTML = '';
    chats.forEach(chat => {
      const div = document.createElement('div');
      div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
      div.textContent = chat.title || 'Без названия';
      div.onclick = () => openChat(chat.id);
      list.appendChild(div);
    });
  }

  async function createNewChat() {
    const res = await fetch('/api/chats', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
    const data = await res.json();
    currentChatId = data.chatId; loadChats();
    document.getElementById('messages').innerHTML = `
      <div class="msg-row bot">
        <div class="avatar">🦫</div>
        <div class="msg-content">Новый чат создан. О чем поговорим?</div>
      </div>`;
  }

  async function openChat(chatId) {
    currentChatId = chatId; loadChats();
    const res = await fetch(`/api/chats/${chatId}/messages`, { headers: { 'Authorization': `Bearer ${token}` } });
    const msgs = await res.json();
    const container = document.getElementById('messages'); container.innerHTML = '';
    msgs.forEach(m => addMessageToUI(m.content, m.role === 'user' ? 'user' : 'bot', m.image_url));
    container.scrollTop = container.scrollHeight;
  }

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
  }

  function handleFileSelect(event) {
    selectedFile = event.target.files[0];
    if (selectedFile) {
      document.getElementById('messageInput').placeholder = `Выбрано фото: ${selectedFile.name}`;
      document.getElementById('messageInput').focus();
    }
  }

  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if ((!text && !selectedFile) || !currentChatId) return;

    addMessageToUI(text || '📷 Фото', 'user');
    
    const formData = new FormData();
    formData.append('message', text); formData.append('mode', currentMode);
    if (selectedFile) formData.append('image', selectedFile);

    input.value = ''; selectedFile = null; document.getElementById('fileInput').value = '';
    input.placeholder = 'Напиши сообщение Бобору...';

    try {
      const res = await fetch(`/api/chats/${currentChatId}/message`, {
        method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData
      });
      const data = await res.json();
      if (res.ok) { 
        addMessageToUI(data.reply, 'bot', data.imageUrl); 
        loadChats(); 
      } else { 
        addMessageToUI('Ошибка: ' + data.error, 'bot'); 
      }
    } catch (err) { addMessageToUI('Ошибка соединения с сервером', 'bot'); }
  }

  function addMessageToUI(text, sender, imageUrl = null) {
    const container = document.getElementById('messages');
    const row = document.createElement('div'); 
    row.className = `msg-row ${sender}`;
    
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = sender === 'user' ? '👤' : '🦫';
    
    const content = document.createElement('div');
    content.className = 'msg-content';
    
    if (text) {
      const textNode = document.createElement('div'); 
      textNode.textContent = text; 
      content.appendChild(textNode);
    }
    
    if (imageUrl && imageUrl.startsWith('http')) {
      const img = document.createElement('img'); 
      img.src = imageUrl; 
      content.appendChild(img);
    }
    
    row.appendChild(avatar);
    row.appendChild(content);
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }
</script>
</body>
</html>
