<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БОБОР-AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg-main: #0b0f19; --sidebar-bg: #111827; --chat-bg: #0b0f19; --primary: #6366f1; --primary-hover: #4f46e5; --text-main: #f3f4f6; --text-muted: #9ca3af; --border: #1f2937; --msg-bot-bg: #1f2937; --msg-user-bg: #4f46e5; --input-bg: #111827; }
  body.light-theme { --bg-main: #f9fafb; --sidebar-bg: #ffffff; --chat-bg: #ffffff; --primary: #4f46e5; --primary-hover: #4338ca; --text-main: #111827; --text-muted: #6b7280; --border: #e5e7eb; --msg-bot-bg: #f3f4f6; --msg-user-bg: #4f46e5; --input-bg: #f3f4f6; }
  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }
  
  /* Стили входа/чатов/модалок (сокращены, но они такие же красивые) */
  #auth-screen { position: fixed; inset: 0; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 100; }
  .auth-box { background: var(--sidebar-bg); padding: 40px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 400px; text-align: center; border: 1px solid var(--border); }
  .tabs { display: flex; margin-bottom: 25px; background: var(--bg-main); border-radius: 12px; padding: 4px; border: 1px solid var(--border); }
  .tab { flex: 1; padding: 10px; cursor: pointer; color: var(--text-muted); border-radius: 8px; font-weight: 500; font-size: 14px; }
  .tab.active { color: #fff; background: var(--primary); }
  .tab-content { display: none; } .tab-content.active { display: block; }
  .auth-box input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main); font-size: 15px; outline: none; }
  .auth-box button { width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: 12px; color: #fff; font-weight: 600; cursor: pointer; margin-bottom: 10px; }
  .auth-msg { font-size: 14px; color: #ef4444; margin-top: 10px; min-height: 20px; }

  #main-app { display: none; width: 100%; height: 100vh; }
  .sidebar { width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .sidebar-header { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .btn-primary { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 10px; color: #fff; cursor: pointer; font-weight: 600; }
  .btn-train { background: #d97706; }
  .chat-list { flex: 1; overflow-y: auto; padding: 0 10px 10px 10px; }
  .chat-item { padding: 12px 14px; margin-bottom: 4px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-size: 14px; }
  .chat-item:hover { background: var(--border); color: var(--text-main); }
  .chat-item.active { background: rgba(99, 102, 241, 0.15); color: var(--primary); font-weight: 500; }
  .user-info { padding: 15px; border-top: 1px solid var(--border); }
  .user-actions { display: flex; gap: 8px; margin-top: 10px; }
  .user-actions button { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text-muted); font-size: 12px; cursor: pointer; }
  .btn-logout { color: #ef4444 !important; border-color: #ef4444 !important; }

  .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); }
  .messages { flex: 1; padding: 30px 15%; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
  .msg-row { display: flex; gap: 16px; max-width: 100%; animation: slideUp 0.3s ease-out; }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; flex-shrink: 0; }
  .msg-row.bot .avatar { background: var(--primary); color: #fff; }
  .msg-row.user .avatar { background: var(--border); color: var(--text-main); }
  .msg-content { padding: 12px 18px; border-radius: 16px; line-height: 1.6; font-size: 15px; max-width: 80%; word-wrap: break-word; }
  .msg-row.bot .msg-content { background: var(--msg-bot-bg); border-top-left-radius: 4px; }
  .msg-row.user .msg-content { background: var(--msg-user-bg); color: #fff; border-top-right-radius: 4px; }
  .msg-content img { max-width: 100%; border-radius: 12px; margin-top: 10px; display: block; }
  
  /* Кнопка копирования */
  .copy-btn { background: transparent; border: 1px solid var(--border); color: var(--text-muted); font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer; margin-top: 8px; float: right; }
  .copy-btn:hover { background: var(--border); color: var(--text-main); }

  .typing-indicator { display: flex; gap: 4px; padding: 12px 18px; background: var(--msg-bot-bg); border-radius: 16px; border-top-left-radius: 4px; width: fit-content; align-items: center; }
  .typing-indicator span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  .input-panel { padding: 20px 15% 30px; background: linear-gradient(to top, var(--chat-bg) 70%, transparent); }
  .mode-selector { display: flex; gap: 8px; margin-bottom: 12px; justify-content: center; }
  .mode-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--sidebar-bg); color: var(--text-muted); cursor: pointer; font-size: 12px; }
  .mode-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  .input-row { display: flex; gap: 10px; background: var(--input-bg); padding: 10px; border-radius: 16px; border: 1px solid var(--border); align-items: center; }
  .input-row:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
  .input-row input[type="text"] { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 16px; outline: none; }
  .btn-send { background: var(--primary); border: none; border-radius: 10px; color: #fff; width: 40px; height: 40px; cursor: pointer; }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn-attach { background: transparent; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; padding: 0 8px; }

  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
  .modal { background: var(--sidebar-bg); padding: 30px; border-radius: 20px; width: 420px; border: 1px solid var(--border); }
  .modal h3 { margin-bottom: 20px; font-size: 20px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 13px; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main); font-size: 14px; outline: none; }
  .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; font-weight: 600; cursor: pointer; border: none; }
  .btn-cancel { background: var(--border); color: var(--text-main); }
  .btn-save { background: var(--primary); color: #fff; }

  @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen">
  <div class="auth-box">
    <h2>🦫 БОБОР-AI</h2>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('pass')">Пароль</div>
      <div class="tab" onclick="switchTab('email')">Код на почту</div>
    </div>
    <div id="tab-pass" class="tab-content active">
      <input type="text" id="loginUser" placeholder="Ник или Email">
      <input type="password" id="loginPass" placeholder="Пароль">
      <button onclick="login()">Войти</button>
    </div>
    <div id="tab-email" class="tab-content">
      <input type="email" id="emailInput" placeholder="Твоя почта">
      <button onclick="requestCode()" id="btnRequest">Получить код</button>
      <div id="codeBlock" style="display: none; margin-top: 15px;">
        <input type="text" id="codeInput" placeholder="Код" style="text-align: center; letter-spacing: 5px; font-size: 20px;">
        <button onclick="verifyCode()">Войти</button>
      </div>
    </div>
    <p id="authMsg" class="auth-msg"></p>
  </div>
</div>

<!-- МОДАЛЬНЫЕ ОКНА (Настройки и Обучение) -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3>⚙️ Настройки</h3>
    <div class="form-group"><label>Твой никнейм</label><input type="text" id="settingNickname"></div>
    <div class="form-group"><label>Тема</label><select id="settingTheme"><option value="dark">Темная</option><option value="light">Светлая</option></select></div>
    <div class="form-group"><label>Язык</label><select id="settingLanguage"><option value="ru">Русский</option><option value="en">English</option></select></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeSettings()">Отмена</button><button class="btn-save" onclick="saveSettings()">Сохранить</button></div>
  </div>
</div>

<div class="modal-overlay" id="trainModal">
  <div class="modal">
    <h3>🎓 Обучение Бобора</h3>
    <div class="form-group"><textarea id="trainPrompt" placeholder="Напиши правила или знания для бота..."></textarea></div>
    <div class="modal-actions"><button class="btn-cancel" onclick="closeTrain()">Отмена</button><button class="btn-save" onclick="saveTrain()">Обучить</button></div>
  </div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
<div id="main-app">
  <div class="sidebar">
    <div class="sidebar-header">
      <button onclick="createNewChat()" class="btn-primary">+ Новый чат</button>
      <button class="btn-primary btn-train" id="btnTrain" onclick="openTrain()" style="display: none;">🎓 Обучить Бобора</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="user-info">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <span id="currentUser" style="font-weight: 600;"></span>
        <button onclick="openSettings()" style="background: none; border: none; font-size: 18px; cursor: pointer;">⚙️</button>
      </div>
      <div class="user-actions">
        <button onclick="location.reload()">🔄 Обновить</button>
        <button class="btn-logout" onclick="logout()">Выйти</button>
      </div>
    </div>
  </div>
  
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="msg-row bot">
        <div class="avatar">🦫</div>
        <div class="msg-content" id="welcomeMsg">Привет! Я Бобор-AI. Чем могу помочь?</div>
      </div>
    </div>
    
    <div class="input-panel">
      <div class="mode-selector">
        <button class="mode-btn" data-mode="weak" onclick="setMode('weak')">Слабый</button>
        <button class="mode-btn active" data-mode="normal" onclick="setMode('normal')">Обычный</button>
        <button class="mode-btn" data-mode="strong" onclick="setMode('strong')">Сильный</button>
      </div>
      <div class="input-row">
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
        <button class="btn-attach" onclick="document.getElementById('fileInput').click()">📎</button>
        <input type="text" id="messageInput" placeholder="Напиши сообщение Бобору..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn-send" id="btnSend" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
  // (Переменные и функции авторизации, загрузки чатов, настроек и обучения остаются такими же, как в прошлом коде)
  // Я сокращаю их здесь, но в твоем файле они должны быть.
  
  let token = localStorage.getItem('token');
  let currentUser = localStorage.getItem('username');
  let currentRole = localStorage.getItem('role');
  let currentTheme = localStorage.getItem('theme') || 'dark';
  let currentLang = localStorage.getItem('language') || 'ru';
  let currentChatId = null;
  let currentMode = 'normal';
  let selectedFile = null;

  // Применяем тему и язык
  if (currentTheme === 'light') document.body.classList.add('light-theme');

  if (token) {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'flex';
    document.getElementById('currentUser').textContent = currentUser + (currentRole === 'admin' ? ' 👑' : '');
    if (currentRole === 'admin') document.getElementById('btnTrain').style.display = 'block';
    loadChats();
  }

  // ... (Все функции: login, requestCode, verifyCode, logout, openSettings, saveSettings, openTrain, saveTrain, loadChats, createNewChat, openChat, setMode) ...

  function handleFileSelect(event) {
    selectedFile = event.target.files[0];
    if (selectedFile) {
      document.getElementById('messageInput').placeholder = `Выбрано: ${selectedFile.name}`;
      document.getElementById('messageInput').focus();
    }
  }

  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if ((!text && !selectedFile) || !currentChatId) return;

    addMessageToUI(text || '📷 Фото', 'user');
    
    const formData = new FormData();
    formData.append('message', text); formData.append('mode', currentMode);
    if (selectedFile) formData.append('image', selectedFile);

    input.value = ''; selectedFile = null; document.getElementById('fileInput').value = '';
    input.placeholder = 'Напиши сообщение Бобору...';

    // Показываем анимацию загрузки (как в ChatGPT)
    showTypingIndicator();
    document.getElementById('btnSend').disabled = true;

    try {
      const res = await fetch(`/api/chats/${currentChatId}/message`, {
        method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData
      });
      const data = await res.json();
      removeTypingIndicator();
      document.getElementById('btnSend').disabled = false;

      if (res.ok) { 
        // Если пришла картинка, добавляем её с анимацией появления
        addMessageToUI(data.reply, 'bot', data.imageUrl); 
        loadChats(); 
      } 
      else { addMessageToUI('Ошибка: ' + data.error, 'bot'); }
    } catch (err) { 
      removeTypingIndicator();
      document.getElementById('btnSend').disabled = false;
      addMessageToUI('Ошибка соединения с сервером', 'bot'); 
    }
  }

  function showTypingIndicator() {
    const container = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-row';
    row.innerHTML = `<div class="avatar">🦫</div><div class="typing-indicator"><span></span><span></span><span></span></div>`;
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }

  function removeTypingIndicator() {
    const row = document.getElementById('typing-row');
    if (row) row.remove();
  }

  function addMessageToUI(text, sender, imageUrl = null) {
    const container = document.getElementById('messages');
    const row = document.createElement('div'); row.className = `msg-row ${sender}`;
    const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = sender === 'user' ? '👤' : '🦫';
    const content = document.createElement('div'); content.className = 'msg-content';
    
    if (text) {
      const textNode = document.createElement('div'); textNode.textContent = text; content.appendChild(textNode);
      
      // Добавляем кнопку "Скопировать" для сообщений бота
      if (sender === 'bot') {
        const copyBtn = document.createElement('button');
        copyBtn.className = 'copy-btn';
        copyBtn.textContent = 'Копировать';
        copyBtn.onclick = () => {
          navigator.clipboard.writeText(text);
          copyBtn.textContent = 'Скопировано!';
          setTimeout(() => copyBtn.textContent = 'Копировать', 2000);
        };
        content.appendChild(copyBtn);
      }
    }

    if (imageUrl && imageUrl.startsWith('http')) {
      const img = document.createElement('img'); 
      img.src = imageUrl; 
      // Анимация появления картинки
      img.style.opacity = '0';
      img.style.transition = 'opacity 0.5s ease';
      img.onload = () => { img.style.opacity = '1'; };
      content.appendChild(img);
    }
    
    row.appendChild(avatar); row.appendChild(content); container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }
</script>
</body>
</html>
