<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БОБОР-AI</title>
<style>
  :root {
    /* Темная тема (по умолчанию) */
    --bg-color: #0f0c29;
    --sidebar-bg: #15132b;
    --chat-bg: #1a1635;
    --primary: #7c3aed;
    --primary-hover: #6d28d9;
    --text-main: #f8fafc;
    --text-muted: #a78bfa;
    --border: #2a2550;
    --msg-bot-bg: rgba(30, 30, 60, 0.9);
    --modal-bg: #15132b;
    --input-bg: rgba(0,0,0,0.3);
  }

  body.light-theme {
    /* Светлая тема */
    --bg-color: #f8fafc;
    --sidebar-bg: #ffffff;
    --chat-bg: #f1f5f9;
    --primary: #6d28d9;
    --primary-hover: #5b21b6;
    --text-main: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --msg-bot-bg: #ffffff;
    --modal-bg: #ffffff;
    --input-bg: #ffffff;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
  body { background: var(--bg-color); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; }

  /* ЭКРАН ВХОДА */
  #auth-screen { position: fixed; inset: 0; background: linear-gradient(135deg, var(--bg-color), var(--sidebar-bg)); display: flex; justify-content: center; align-items: center; z-index: 100; }
  .auth-box { background: var(--sidebar-bg); padding: 40px; border-radius: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); width: 380px; text-align: center; border: 1px solid var(--border); }
  .auth-box h2 { margin-bottom: 25px; font-size: 28px; color: var(--text-main); display: flex; align-items: center; justify-content: center; gap: 10px; }
  
  .tabs { display: flex; margin-bottom: 25px; background: rgba(124, 58, 237, 0.1); border-radius: 12px; padding: 4px; }
  .tab { flex: 1; padding: 10px; cursor: pointer; color: var(--text-muted); border-radius: 8px; font-weight: 600; }
  .tab.active { color: #fff; background: var(--primary); }
  
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .auth-box input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-main); font-size: 15px; outline: none; }
  .auth-box input:focus { border-color: var(--primary); }
  .auth-box button { width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: 12px; color: #fff; font-weight: bold; font-size: 16px; cursor: pointer; margin-bottom: 10px; }
  .auth-msg { font-size: 14px; color: #f87171; margin-top: 10px; min-height: 20px; }

  /* ОСНОВНОЙ ИНТЕРФЕЙС */
  #main-app { display: none; width: 100%; height: 100vh; }
  
  /* САЙДБАР */
  .sidebar { width: 280px; background: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .sidebar-header { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .sidebar-header button { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 12px; color: #fff; cursor: pointer; font-weight: bold; display: flex; justify-content: center; align-items: center; gap: 8px; }
  .settings-btn { background: transparent !important; border: 1px solid var(--border) !important; color: var(--text-main) !important; }
  
  .chat-list { flex: 1; overflow-y: auto; padding: 0 10px 10px 10px; }
  .chat-item { padding: 14px; margin-bottom: 4px; border-radius: 10px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); font-size: 14px; }
  .chat-item:hover { background: rgba(124, 58, 237, 0.1); color: var(--text-main); }
  .chat-item.active { background: rgba(124, 58, 237, 0.2); color: var(--text-main); font-weight: 600; border-left: 3px solid var(--primary); }
  .user-info { padding: 15px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 14px; background: rgba(0,0,0,0.05); }
  .logout-btn { background: none; border: none; color: #f87171; cursor: pointer; font-weight: 600; }

  /* ЧАТ */
  .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); }
  .messages { flex: 1; padding: 30px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
  .msg-row { display: flex; gap: 15px; max-width: 85%; }
  .msg-row.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 20px; flex-shrink: 0; }
  .msg-row.bot .avatar { background: rgba(124, 58, 237, 0.2); border: 1px solid var(--primary); }
  .msg-row.user .avatar { background: var(--primary); border: 1px solid var(--primary); }
  .msg-content { padding: 14px 18px; border-radius: 16px; line-height: 1.6; font-size: 15px; word-wrap: break-word; }
  .msg-row.bot .msg-content { background: var(--msg-bot-bg); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg-row.user .msg-content { background: var(--primary); border-top-right-radius: 4px; color: #fff; }
  .msg-content img { max-width: 100%; border-radius: 10px; margin-top: 10px; display: block; }

  /* ПАНЕЛЬ ВВОДА */
  .input-panel { padding: 20px 30px; background: var(--chat-bg); border-top: 1px solid var(--border); }
  .mode-selector { display: flex; gap: 10px; margin-bottom: 15px; justify-content: center; }
  .mode-btn { padding: 6px 16px; border-radius: 20px; border: 1px solid var(--border); background: transparent; color: var(--text-muted); cursor: pointer; font-size: 13px; }
  .mode-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  
  .input-row { display: flex; gap: 12px; background: var(--input-bg); padding: 10px; border-radius: 16px; border: 1px solid var(--border); align-items: center; }
  .input-row:focus-within { border-color: var(--primary); }
  .input-row input[type="text"] { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 16px; outline: none; padding: 5px; }
  .action-btn { background: var(--primary); border: none; border-radius: 10px; color: #fff; width: 42px; height: 42px; cursor: pointer; display: flex; justify-content: center; align-items: center; }
  .attach-btn { background: transparent; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; padding: 0 10px; }

  /* МОДАЛЬНОЕ ОКНО НАСТРОЕК */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 1000; }
  .modal { background: var(--modal-bg); padding: 30px; border-radius: 20px; width: 400px; border: 1px solid var(--border); box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  .modal h3 { margin-bottom: 20px; color: var(--text-main); font-size: 22px; }
  .form-group { margin-bottom: 20px; text-align: left; }
  .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 14px; }
  .form-group input, .form-group select { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--input-bg); color: var(--text-main); font-size: 15px; outline: none; }
  .form-group input:focus, .form-group select:focus { border-color: var(--primary); }
  .modal-actions { display: flex; gap: 10px; margin-top: 30px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; font-weight: bold; cursor: pointer; border: none; }
  .btn-cancel { background: var(--border); color: var(--text-main); }
  .btn-save { background: var(--primary); color: #fff; }

  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen">
  <div class="auth-box">
    <h2>🦫 БОБОР-AI</h2>
    
    <div class="tabs">
      <div class="tab active" onclick="switchTab('pass')" id="tabBtnPass">Пароль</div>
      <div class="tab" onclick="switchTab('email')" id="tabBtnEmail">Код на почту</div>
    </div>

    <div id="tab-pass" class="tab-content active">
      <input type="text" id="loginUser" placeholder="Ник или Email">
      <input type="password" id="loginPass" placeholder="Пароль">
      <button onclick="login()" id="btnLogin">Войти</button>
    </div>

    <div id="tab-email" class="tab-content">
      <input type="email" id="emailInput" placeholder="Твоя почта">
      <button onclick="requestCode()" id="btnRequest">Получить код</button>
      
      <div id="codeBlock" style="display: none; margin-top: 15px;">
        <input type="text" id="codeInput" placeholder="Введи 6-значный код" style="text-align: center; letter-spacing: 5px; font-size: 20px;">
        <button onclick="verifyCode()" id="btnVerify">Войти</button>
      </div>
    </div>

    <p id="authMsg" class="auth-msg"></p>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3 id="settingsTitle">⚙️ Настройки</h3>
    
    <div class="form-group">
      <label id="labelNick">Твой никнейм</label>
      <input type="text" id="settingNickname" placeholder="Введи новый ник">
    </div>

    <div class="form-group">
      <label id="labelTheme">Тема оформления</label>
      <select id="settingTheme">
        <option value="dark" id="optThemeDark">Темная (Dark)</option>
        <option value="light" id="optThemeLight">Светлая (Light)</option>
      </select>
    </div>

    <div class="form-group">
      <label id="labelLang">Язык интерфейса</label>
      <select id="settingLanguage">
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </div>

    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeSettings()" id="btnCancel">Отмена</button>
      <button class="btn-save" onclick="saveSettings()" id="btnSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
<div id="main-app">
  <div class="sidebar">
    <div class="sidebar-header">
      <button onclick="createNewChat()" id="btnNewChat">+ Новый чат</button>
      <button class="settings-btn" onclick="openSettings()" id="btnSettings">⚙️ Настройки</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="user-info">
      <span id="currentUser" style="font-weight: 600;"></span>
      <button class="logout-btn" onclick="logout()" id="btnLogout">Выйти</button>
    </div>
  </div>
  
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="msg-row bot">
        <div class="avatar">🦫</div>
        <div class="msg-content" id="welcomeMsg">Привет! Я Бобор-AI. Чем могу помочь?</div>
      </div>
    </div>
    
    <div class="input-panel">
      <div class="mode-selector">
        <button class="mode-btn" data-mode="weak" onclick="setMode('weak')" id="modeWeak">Слабый</button>
        <button class="mode-btn active" data-mode="normal" onclick="setMode('normal')" id="modeNormal">Обычный</button>
        <button class="mode-btn" data-mode="strong" onclick="setMode('strong')" id="modeStrong">Сильный</button>
      </div>
      <div class="input-row">
        <input type="file" id="fileInput" accept="image/*" style="display: none;" onchange="handleFileSelect(event)">
        <button class="attach-btn" onclick="document.getElementById('fileInput').click()">📎</button>
        <input type="text" id="messageInput" placeholder="Напиши сообщение Бобору..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="action-btn" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
  let token = localStorage.getItem('token');
  let currentUser = localStorage.getItem('username');
  let currentRole = localStorage.getItem('role');
  let currentTheme = localStorage.getItem('theme') || 'dark';
  let currentLang = localStorage.getItem('language') || 'ru';
  let currentChatId = null;
  let currentMode = 'normal';
  let selectedFile = null;

  // Словарь переводов
  const translations = {
    ru: {
      tabPass: "Пароль", tabEmail: "Код на почту", btnLogin: "Войти", btnRequest: "Получить код", btnVerify: "Войти",
      btnNewChat: "+ Новый чат", btnSettings: "⚙️ Настройки", btnLogout: "Выйти", welcome: "Привет! Я Бобор-AI. Чем могу помочь?",
      modeWeak: "Слабый", modeNormal: "Обычный", modeStrong: "Сильный", placeholder: "Напиши сообщение Бобору...",
      settingsTitle: "⚙️ Настройки", labelNick: "Твой никнейм", labelTheme: "Тема оформления", labelLang: "Язык интерфейса",
      optDark: "Темная (Dark)", optLight: "Светлая (Light)", btnCancel: "Отмена", btnSave: "Сохранить"
    },
    en: {
      tabPass: "Password", tabEmail: "Email Code", btnLogin: "Login", btnRequest: "Get Code", btnVerify: "Login",
      btnNewChat: "+ New Chat", btnSettings: "⚙️ Settings", btnLogout: "Logout", welcome: "Hi! I'm Bobor-AI. How can I help?",
      modeWeak: "Weak", modeNormal: "Normal", modeStrong: "Strong", placeholder: "Message Bobor...",
      settingsTitle: "⚙️ Settings", labelNick: "Your Nickname", labelTheme: "Theme", labelLang: "Interface Language",
      optDark: "Dark", optLight: "Light", btnCancel: "Cancel", btnSave: "Save"
    }
  };

  function applyLanguage(lang) {
    document.getElementById('tabBtnPass').textContent = translations[lang].tabPass;
    document.getElementById('tabBtnEmail').textContent = translations[lang].tabEmail;
    document.getElementById('btnLogin').textContent = translations[lang].btnLogin;
    document.getElementById('btnRequest').textContent = translations[lang].btnRequest;
    document.getElementById('btnVerify').textContent = translations[lang].btnVerify;
    
    document.getElementById('btnNewChat').textContent = translations[lang].btnNewChat;
    document.getElementById('btnSettings').textContent = translations[lang].btnSettings;
    document.getElementById('btnLogout').textContent = translations[lang].btnLogout;
    document.getElementById('welcomeMsg').textContent = translations[lang].welcome;
    
    document.getElementById('modeWeak').textContent = translations[lang].modeWeak;
    document.getElementById('modeNormal').textContent = translations[lang].modeNormal;
    document.getElementById('modeStrong').textContent = translations[lang].modeStrong;
    document.getElementById('messageInput').placeholder = translations[lang].placeholder;
    
    document.getElementById('settingsTitle').textContent = translations[lang].settingsTitle;
    document.getElementById('labelNick').textContent = translations[lang].labelNick;
    document.getElementById('labelTheme').textContent = translations[lang].labelTheme;
    document.getElementById('labelLang').textContent = translations[lang].labelLang;
    document.getElementById('optThemeDark').textContent = translations[lang].optDark;
    document.getElementById('optThemeLight').textContent = translations[lang].optLight;
    document.getElementById('btnCancel').textContent = translations[lang].btnCancel;
    document.getElementById('btnSave').textContent = translations[lang].btnSave;
  }

  function applyTheme(theme) {
    if (theme === 'light') document.body.classList.add('light-theme');
    else document.body.classList.remove('light-theme');
  }

  // Инициализация темы и языка при загрузке
  applyTheme(currentTheme);
  applyLanguage(currentLang);

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    if (tab === 'pass') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('tab-pass').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('tab-email').classList.add('active');
    }
    document.getElementById('authMsg').textContent = '';
  }

  async function login() {
    const username = document.getElementById('loginUser').value;
    const password = document.getElementById('loginPass').value;
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token); localStorage.setItem('username', data.username); localStorage.setItem('role', data.role);
      localStorage.setItem('theme', data.theme); localStorage.setItem('language', data.language);
      location.reload();
    } else { document.getElementById('authMsg').textContent = data.error; }
  }

  async function requestCode() {
    const email = document.getElementById('emailInput').value;
    if (!email) return document.getElementById('authMsg').textContent = 'Введите почту';
    const res = await fetch('/api/send-code', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email })
    });
    const data = await res.json();
    if (res.ok) {
      document.getElementById('btnRequest').style.display = 'none';
      document.getElementById('codeBlock').style.display = 'block';
      document.getElementById('authMsg').style.color = '#34d399';
      document.getElementById('authMsg').textContent = data.message;
    } else { 
      document.getElementById('authMsg').style.color = '#f87171';
      document.getElementById('authMsg').textContent = data.error; 
    }
  }

  async function verifyCode() {
    const email = document.getElementById('emailInput').value;
    const code = document.getElementById('codeInput').value;
    const res = await fetch('/api/verify-code', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ email, code })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token); localStorage.setItem('username', data.username); localStorage.setItem('role', data.role);
      localStorage.setItem('theme', data.theme); localStorage.setItem('language', data.language);
      location.reload();
    } else { 
      document.getElementById('authMsg').style.color = '#f87171';
      document.getElementById('authMsg').textContent = data.error; 
    }
  }

  function logout() {
    localStorage.clear();
    location.reload();
  }

  function initApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'flex';
    document.getElementById('currentUser').textContent = currentUser + (currentRole === 'admin' ? ' 👑' : '');
    loadChats();
  }

  if (token) initApp();

  // --- НАСТРОЙКИ ---
  function openSettings() {
    document.getElementById('settingNickname').value = currentUser;
    document.getElementById('settingTheme').value = currentTheme;
    document.getElementById('settingLanguage').value = currentLang;
    document.getElementById('settingsModal').style.display = 'flex';
  }

  function closeSettings() {
    document.getElementById('settingsModal').style.display = 'none';
  }

  async function saveSettings() {
    const newNick = document.getElementById('settingNickname').value;
    const newTheme = document.getElementById('settingTheme').value;
    const newLang = document.getElementById('settingLanguage').value;

    const res = await fetch('/api/user/settings', {
      method: 'POST', 
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ username: newNick, theme: newTheme, language: newLang })
    });
    const data = await res.json();
    
    if (res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('username', data.username);
      localStorage.setItem('theme', data.theme);
      localStorage.setItem('language', data.language);
      location.reload(); // Перезагружаем, чтобы применить всё
    } else {
      alert(data.error);
    }
  }

  // --- ЧАТЫ ---
  async function loadChats() {
    const res = await fetch('/api/chats', { headers: { 'Authorization': `Bearer ${token}` } });
    const chats = await res.json();
    const list = document.getElementById('chatList');
    list.innerHTML = '';
    chats.forEach(chat => {
      const div = document.createElement('div');
      div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
      div.textContent = chat.title || 'Без названия';
      div.onclick = () => openChat(chat.id);
      list.appendChild(div);
    });
  }

  async function createNewChat() {
    const res = await fetch('/api/chats', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
    const data = await res.json();
    currentChatId = data.chatId; loadChats();
    document.getElementById('messages').innerHTML = `
      <div class="msg-row bot">
        <div class="avatar">🦫</div>
        <div class="msg-content">${translations[currentLang].welcome}</div>
      </div>`;
  }

  async function openChat(chatId) {
    currentChatId = chatId; loadChats();
    const res = await fetch(`/api/chats/${chatId}/messages`, { headers: { 'Authorization': `Bearer ${token}` } });
    const msgs = await res.json();
    const container = document.getElementById('messages'); container.innerHTML = '';
    msgs.forEach(m => addMessageToUI(m.content, m.role === 'user' ? 'user' : 'bot', m.image_url));
    container.scrollTop = container.scrollHeight;
  }

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
  }

  function handleFileSelect(event) {
    selectedFile = event.target.files[0];
    if (selectedFile) {
      document.getElementById('messageInput').placeholder = `Выбрано фото: ${selectedFile.name}`;
      document.getElementById('messageInput').focus();
    }
  }

  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if ((!text && !selectedFile) || !currentChatId) return;

    addMessageToUI(text || '📷 Фото', 'user');
    
    const formData = new FormData();
    formData.append('message', text); formData.append('mode', currentMode);
    if (selectedFile) formData.append('image', selectedFile);

    input.value = ''; selectedFile = null; document.getElementById('fileInput').value = '';
    input.placeholder = translations[currentLang].placeholder;

    try {
      const res = await fetch(`/api/chats/${currentChatId}/message`, {
        method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData
      });
      const data = await res.json();
      if (res.ok) { 
        addMessageToUI(data.reply, 'bot', data.imageUrl); 
        loadChats(); 
      } else { 
        addMessageToUI('Ошибка: ' + data.error, 'bot'); 
      }
    } catch (err) { addMessageToUI('Ошибка соединения с сервером', 'bot'); }
  }

  function addMessageToUI(text, sender, imageUrl = null) {
    const container = document.getElementById('messages');
    const row = document.createElement('div'); 
    row.className = `msg-row ${sender}`;
    
    const avatar = document.createElement('div');
    avatar.className = 'avatar';
    avatar.textContent = sender === 'user' ? '👤' : '🦫';
    
    const content = document.createElement('div');
    content.className = 'msg-content';
    
    if (text) {
      const textNode = document.createElement('div'); 
      textNode.textContent = text; 
      content.appendChild(textNode);
    }
    
    if (imageUrl && imageUrl.startsWith('http')) {
      const img = document.createElement('img'); 
      img.src = imageUrl; 
      content.appendChild(img);
    }
    
    row.appendChild(avatar);
    row.appendChild(content);
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }
</script>
</body>
</html>
