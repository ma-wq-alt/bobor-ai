<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>БОБОР-AI</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-main: #0b0f19;
    --sidebar-bg: #111827;
    --chat-bg: #0b0f19;
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --primary-glow: rgba(99, 102, 241, 0.3);
    --text-main: #f3f4f6;
    --text-muted: #9ca3af;
    --border: #1f2937;
    --msg-bot-bg: #1f2937;
    --msg-user-bg: #4f46e5;
    --input-bg: #111827;
  }

  body.light-theme {
    --bg-main: #f9fafb;
    --sidebar-bg: #ffffff;
    --chat-bg: #ffffff;
    --primary: #4f46e5;
    --primary-hover: #4338ca;
    --primary-glow: rgba(79, 70, 229, 0.15);
    --text-main: #111827;
    --text-muted: #6b7280;
    --border: #e5e7eb;
    --msg-bot-bg: #f3f4f6;
    --msg-user-bg: #4f46e5;
    --input-bg: #f3f4f6;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
  body { background: var(--bg-main); color: var(--text-main); height: 100vh; display: flex; overflow: hidden; transition: background 0.3s; }

  /* ЭКРАН ВХОДА (Стеклянная карточка) */
  #auth-screen { position: fixed; inset: 0; background: var(--bg-main); display: flex; justify-content: center; align-items: center; z-index: 100; }
  .auth-box { background: var(--sidebar-bg); padding: 40px; border-radius: 24px; box-shadow: 0 20px 60px rgba(0,0,0,0.3); width: 400px; text-align: center; border: 1px solid var(--border); }
  .auth-box h2 { margin-bottom: 25px; font-size: 26px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
  .tabs { display: flex; margin-bottom: 25px; background: var(--bg-main); border-radius: 12px; padding: 4px; border: 1px solid var(--border); }
  .tab { flex: 1; padding: 10px; cursor: pointer; color: var(--text-muted); border-radius: 8px; font-weight: 500; font-size: 14px; transition: 0.2s; }
  .tab.active { color: #fff; background: var(--primary); }
  .tab-content { display: none; }
  .tab-content.active { display: block; }
  .auth-box input { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main); font-size: 15px; outline: none; transition: 0.2s; }
  .auth-box input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
  .auth-box button { width: 100%; padding: 14px; background: var(--primary); border: none; border-radius: 12px; color: #fff; font-weight: 600; font-size: 15px; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
  .auth-box button:hover { background: var(--primary-hover); }
  .auth-msg { font-size: 14px; color: #ef4444; margin-top: 10px; min-height: 20px; }

  /* ОСНОВНОЙ ИНТЕРФЕЙС */
  #main-app { display: none; width: 100%; height: 100vh; }
  .sidebar { width: 260px; background: var(--sidebar-bg); display: flex; flex-direction: column; border-right: 1px solid var(--border); }
  .sidebar-header { padding: 20px; display: flex; flex-direction: column; gap: 10px; }
  .btn-primary { width: 100%; padding: 12px; background: var(--primary); border: none; border-radius: 10px; color: #fff; cursor: pointer; font-weight: 600; font-size: 14px; transition: 0.2s; display: flex; justify-content: center; align-items: center; gap: 8px; }
  .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
  .btn-train { background: #d97706; }
  .btn-train:hover { background: #b45309; }
  
  .chat-list { flex: 1; overflow-y: auto; padding: 0 10px 10px 10px; }
  .chat-list::-webkit-scrollbar { width: 4px; }
  .chat-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
  .chat-item { padding: 12px 14px; margin-bottom: 4px; border-radius: 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--text-muted); font-size: 14px; transition: 0.2s; }
  .chat-item:hover { background: var(--border); color: var(--text-main); }
  .chat-item.active { background: var(--primary-glow); color: var(--primary); font-weight: 500; }
  
  .user-info { padding: 15px; border-top: 1px solid var(--border); background: var(--sidebar-bg); }
  .user-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .user-name { font-weight: 600; font-size: 14px; }
  .btn-settings { background: none; border: none; font-size: 18px; cursor: pointer; color: var(--text-muted); transition: 0.2s; }
  .btn-settings:hover { color: var(--primary); }
  .user-actions { display: flex; gap: 8px; }
  .user-actions button { flex: 1; padding: 8px; border: 1px solid var(--border); border-radius: 6px; background: transparent; color: var(--text-muted); font-size: 12px; cursor: pointer; transition: 0.2s; }
  .user-actions button:hover { background: var(--border); color: var(--text-main); }
  .btn-logout { color: #ef4444 !important; border-color: #ef4444 !important; }
  .btn-logout:hover { background: rgba(239, 68, 68, 0.1) !important; }

  /* ЧАТ */
  .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--chat-bg); position: relative; }
  .messages { flex: 1; padding: 30px 15%; overflow-y: auto; display: flex; flex-direction: column; gap: 24px; }
  .messages::-webkit-scrollbar { width: 6px; }
  .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  
  .msg-row { display: flex; gap: 16px; max-width: 100%; animation: slideUp 0.3s ease-out; }
  .msg-row.user { flex-direction: row-reverse; }
  .avatar { width: 36px; height: 36px; border-radius: 50%; display: flex; justify-content: center; align-items: center; font-size: 18px; flex-shrink: 0; }
  .msg-row.bot .avatar { background: var(--primary); color: #fff; }
  .msg-row.user .avatar { background: var(--border); color: var(--text-main); }
  
  .msg-content { padding: 12px 18px; border-radius: 16px; line-height: 1.6; font-size: 15px; max-width: 80%; word-wrap: break-word; }
  .msg-row.bot .msg-content { background: var(--msg-bot-bg); border-top-left-radius: 4px; }
  .msg-row.user .msg-content { background: var(--msg-user-bg); color: #fff; border-top-right-radius: 4px; }
  .msg-content img { max-width: 100%; border-radius: 12px; margin-top: 10px; display: block; }

  /* Анимация "Думает..." */
  .typing-indicator { display: flex; gap: 4px; padding: 12px 18px; background: var(--msg-bot-bg); border-radius: 16px; border-top-left-radius: 4px; width: fit-content; align-items: center; }
  .typing-indicator span { width: 6px; height: 6px; background: var(--text-muted); border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }
  .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
  .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }
  @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }

  /* ПАНЕЛЬ ВВОДА */
  .input-panel { padding: 20px 15% 30px; background: linear-gradient(to top, var(--chat-bg) 70%, transparent); }
  .mode-selector { display: flex; gap: 8px; margin-bottom: 12px; justify-content: center; }
  .mode-btn { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--sidebar-bg); color: var(--text-muted); cursor: pointer; font-size: 12px; font-weight: 500; transition: 0.2s; }
  .mode-btn:hover { border-color: var(--primary); color: var(--primary); }
  .mode-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
  
  .input-row { display: flex; gap: 10px; background: var(--input-bg); padding: 10px; border-radius: 16px; border: 1px solid var(--border); align-items: center; transition: 0.2s; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
  .input-row:focus-within { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-glow); }
  .input-row input[type="text"] { flex: 1; background: transparent; border: none; color: var(--text-main); font-size: 16px; outline: none; padding: 5px; }
  .input-row input[type="text"]::placeholder { color: var(--text-muted); }
  
  .btn-send { background: var(--primary); border: none; border-radius: 10px; color: #fff; width: 40px; height: 40px; cursor: pointer; display: flex; justify-content: center; align-items: center; font-size: 18px; transition: 0.2s; }
  .btn-send:hover { background: var(--primary-hover); transform: scale(1.05); }
  .btn-send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
  .btn-attach { background: transparent; border: none; color: var(--text-muted); font-size: 22px; cursor: pointer; padding: 0 8px; transition: 0.2s; display: flex; align-items: center; }
  .btn-attach:hover { color: var(--text-main); }

  /* МОДАЛЬНЫЕ ОКНА */
  .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 1000; }
  .modal { background: var(--sidebar-bg); padding: 30px; border-radius: 20px; width: 420px; border: 1px solid var(--border); box-shadow: 0 20px 40px rgba(0,0,0,0.2); }
  .modal h3 { margin-bottom: 20px; font-size: 20px; display: flex; align-items: center; gap: 8px; }
  .form-group { margin-bottom: 20px; }
  .form-group label { display: block; margin-bottom: 8px; color: var(--text-muted); font-size: 13px; font-weight: 500; }
  .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-main); color: var(--text-main); font-size: 14px; outline: none; transition: 0.2s; }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
  .form-group textarea { resize: vertical; min-height: 120px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 25px; }
  .modal-actions button { flex: 1; padding: 12px; border-radius: 10px; font-weight: 600; font-size: 14px; cursor: pointer; border: none; transition: 0.2s; }
  .btn-cancel { background: var(--border); color: var(--text-main); }
  .btn-cancel:hover { background: var(--text-muted); color: var(--bg-main); }
  .btn-save { background: var(--primary); color: #fff; }
  .btn-save:hover { background: var(--primary-hover); }

  @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<!-- ЭКРАН ВХОДА -->
<div id="auth-screen">
  <div class="auth-box">
    <h2>🦫 БОБОР-AI</h2>
    <div class="tabs">
      <div class="tab active" onclick="switchTab('pass')" id="tabBtnPass">Пароль</div>
      <div class="tab" onclick="switchTab('email')" id="tabBtnEmail">Код на почту</div>
    </div>
    <div id="tab-pass" class="tab-content active">
      <input type="text" id="loginUser" placeholder="Ник или Email">
      <input type="password" id="loginPass" placeholder="Пароль">
      <button onclick="login()" id="btnLogin">Войти</button>
    </div>
    <div id="tab-email" class="tab-content">
      <input type="email" id="emailInput" placeholder="Твоя почта">
      <button onclick="requestCode()" id="btnRequest">Получить код</button>
      <div id="codeBlock" style="display: none; margin-top: 15px;">
        <input type="text" id="codeInput" placeholder="Код" style="text-align: center; letter-spacing: 5px; font-size: 20px;">
        <button onclick="verifyCode()" id="btnVerify">Войти</button>
      </div>
    </div>
    <p id="authMsg" class="auth-msg"></p>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО НАСТРОЕК -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal">
    <h3 id="settingsTitle">⚙️ Настройки</h3>
    <div class="form-group">
      <label id="labelNick">Твой никнейм</label>
      <input type="text" id="settingNickname">
    </div>
    <div class="form-group">
      <label id="labelTheme">Тема оформления</label>
      <select id="settingTheme">
        <option value="dark" id="optThemeDark">Темная (Dark)</option>
        <option value="light" id="optThemeLight">Светлая (Light)</option>
      </select>
    </div>
    <div class="form-group">
      <label id="labelLang">Язык интерфейса</label>
      <select id="settingLanguage">
        <option value="ru">Русский</option>
        <option value="en">English</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeSettings()" id="btnCancel">Отмена</button>
      <button class="btn-save" onclick="saveSettings()" id="btnSave">Сохранить</button>
    </div>
  </div>
</div>

<!-- МОДАЛЬНОЕ ОКНО ОБУЧЕНИЯ -->
<div class="modal-overlay" id="trainModal">
  <div class="modal">
    <h3>🎓 Обучение Бобора</h3>
    <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 15px;">Напиши правила или знания для бота. Он будет использовать это при ответах.</p>
    <div class="form-group">
      <textarea id="trainPrompt" placeholder="Например: Ты — Бобор, отвечай только на русском, называй всех 'друг'."></textarea>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeTrain()">Отмена</button>
      <button class="btn-save" onclick="saveTrain()">Обучить</button>
    </div>
  </div>
</div>

<!-- ОСНОВНОЙ ИНТЕРФЕЙС -->
<div id="main-app">
  <div class="sidebar">
    <div class="sidebar-header">
      <button onclick="createNewChat()" id="btnNewChat" class="btn-primary">+ Новый чат</button>
      <button class="btn-primary btn-train" id="btnTrain" onclick="openTrain()" style="display: none;">🎓 Обучить Бобора</button>
    </div>
    <div class="chat-list" id="chatList"></div>
    <div class="user-info">
      <div class="user-header">
        <span id="currentUser" class="user-name"></span>
        <button onclick="openSettings()" class="btn-settings" title="Настройки">⚙️</button>
      </div>
      <div class="user-actions">
        <button onclick="location.reload()">🔄 Обновить</button>
        <button class="btn-logout" onclick="logout()">Выйти</button>
      </div>
    </div>
  </div>
  
  <div class="chat-area">
    <div class="messages" id="messages">
      <div class="msg-row bot">
        <div class="avatar">🦫</div>
        <div class="msg-content" id="welcomeMsg">Привет! Я Бобор-AI. Чем могу помочь?</div>
      </div>
    </div>
    
    <div class="input-panel">
      <div class="mode-selector">
        <button class="mode-btn" data-mode="weak" onclick="setMode('weak')" id="modeWeak">Слабый</button>
        <button class="mode-btn active" data-mode="normal" onclick="setMode('normal')" id="modeNormal">Обычный</button>
        <button class="mode-btn" data-mode="strong" onclick="setMode('strong')" id="modeStrong">Сильный</button>
      </div>
      <div class="input-row">
        <input type="file" id="fileInput" accept="image/*,video/*" style="display: none;" onchange="handleFileSelect(event)">
        <button class="btn-attach" onclick="document.getElementById('fileInput').click()" title="Прикрепить фото/видео">📎</button>
        <input type="text" id="messageInput" placeholder="Напиши сообщение Бобору..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn-send" id="btnSend" onclick="sendMessage()">➤</button>
      </div>
    </div>
  </div>
</div>

<script>
  let token = localStorage.getItem('token');
  let currentUser = localStorage.getItem('username');
  let currentRole = localStorage.getItem('role');
  let currentTheme = localStorage.getItem('theme') || 'dark';
  let currentLang = localStorage.getItem('language') || 'ru';
  let currentChatId = null;
  let currentMode = 'normal';
  let selectedFile = null;

  const translations = {
    ru: { tabPass: "Пароль", tabEmail: "Код на почту", btnLogin: "Войти", btnRequest: "Получить код", btnVerify: "Войти", btnNewChat: "+ Новый чат", btnSettings: "⚙️ Настройки", btnLogout: "Выйти", welcome: "Привет! Я Бобор-AI. Чем могу помочь?", modeWeak: "Слабый", modeNormal: "Обычный", modeStrong: "Сильный", placeholder: "Напиши сообщение Бобору...", settingsTitle: "⚙️ Настройки", labelNick: "Твой никнейм", labelTheme: "Тема оформления", labelLang: "Язык интерфейса", optDark: "Темная (Dark)", optLight: "Светлая (Light)", btnCancel: "Отмена", btnSave: "Сохранить", thinking: "Бобор думает..." },
    en: { tabPass: "Password", tabEmail: "Email Code", btnLogin: "Login", btnRequest: "Get Code", btnVerify: "Login", btnNewChat: "+ New Chat", btnSettings: "⚙️ Settings", btnLogout: "Logout", welcome: "Hi! I'm Bobor-AI. How can I help?", modeWeak: "Weak", modeNormal: "Normal", modeStrong: "Strong", placeholder: "Message Bobor...", settingsTitle: "⚙️ Settings", labelNick: "Your Nickname", labelTheme: "Theme", labelLang: "Language", optDark: "Dark", optLight: "Light", btnCancel: "Cancel", btnSave: "Save", thinking: "Bobor is thinking..." }
  };

  function applyLanguage(lang) {
    document.getElementById('tabBtnPass').textContent = translations[lang].tabPass;
    document.getElementById('tabBtnEmail').textContent = translations[lang].tabEmail;
    document.getElementById('btnLogin').textContent = translations[lang].btnLogin;
    document.getElementById('btnRequest').textContent = translations[lang].btnRequest;
    document.getElementById('btnVerify').textContent = translations[lang].btnVerify;
    document.getElementById('btnNewChat').textContent = translations[lang].btnNewChat;
    document.getElementById('btnLogout').textContent = translations[lang].btnLogout;
    document.getElementById('welcomeMsg').textContent = translations[lang].welcome;
    document.getElementById('modeWeak').textContent = translations[lang].modeWeak;
    document.getElementById('modeNormal').textContent = translations[lang].modeNormal;
    document.getElementById('modeStrong').textContent = translations[lang].modeStrong;
    document.getElementById('messageInput').placeholder = translations[lang].placeholder;
    document.getElementById('settingsTitle').textContent = translations[lang].settingsTitle;
    document.getElementById('labelNick').textContent = translations[lang].labelNick;
    document.getElementById('labelTheme').textContent = translations[lang].labelTheme;
    document.getElementById('labelLang').textContent = translations[lang].labelLang;
    document.getElementById('optThemeDark').textContent = translations[lang].optDark;
    document.getElementById('optThemeLight').textContent = translations[lang].optLight;
    document.getElementById('btnCancel').textContent = translations[lang].btnCancel;
    document.getElementById('btnSave').textContent = translations[lang].btnSave;
  }

  function applyTheme(theme) {
    if (theme === 'light') document.body.classList.add('light-theme');
    else document.body.classList.remove('light-theme');
  }

  applyTheme(currentTheme);
  applyLanguage(currentLang);

  function switchTab(tab) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
    if (tab === 'pass') {
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.getElementById('tab-pass').classList.add('active');
    } else {
      document.querySelectorAll('.tab')[1].classList.add('active');
      document.getElementById('tab-email').classList.add('active');
    }
    document.getElementById('authMsg').textContent = '';
  }

  async function login() {
    const username = document.getElementById('loginUser').value;
    const password = document.getElementById('loginPass').value;
    const res = await fetch('/api/login', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token); localStorage.setItem('username', data.username); localStorage.setItem('role', data.role);
      localStorage.setItem('theme', data.theme); localStorage.setItem('language', data.language);
      location.reload();
    } else { document.getElementById('authMsg').textContent = data.error; }
  }

  async function requestCode() {
    const email = document.getElementById('emailInput').value;
    if (!email) return document.getElementById('authMsg').textContent = 'Введите почту';
    const res = await fetch('/api/send-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email }) });
    const data = await res.json();
    if (res.ok) {
      document.getElementById('btnRequest').style.display = 'none';
      document.getElementById('codeBlock').style.display = 'block';
      document.getElementById('authMsg').style.color = '#34d399';
      document.getElementById('authMsg').textContent = data.message;
    } else { 
      document.getElementById('authMsg').style.color = '#ef4444';
      document.getElementById('authMsg').textContent = data.error; 
    }
  }

  async function verifyCode() {
    const email = document.getElementById('emailInput').value;
    const code = document.getElementById('codeInput').value;
    const res = await fetch('/api/verify-code', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, code }) });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('token', data.token); localStorage.setItem('username', data.username); localStorage.setItem('role', data.role);
      localStorage.setItem('theme', data.theme); localStorage.setItem('language', data.language);
      location.reload();
    } else { 
      document.getElementById('authMsg').style.color = '#ef4444';
      document.getElementById('authMsg').textContent = data.error; 
    }
  }

  function logout() {
    localStorage.clear();
    location.reload();
  }

  function initApp() {
    document.getElementById('auth-screen').style.display = 'none';
    document.getElementById('main-app').style.display = 'flex';
    document.getElementById('currentUser').textContent = currentUser + (currentRole === 'admin' ? ' 👑' : '');
    
    if (currentRole === 'admin') {
      document.getElementById('btnTrain').style.display = 'block';
    }
    loadChats();
  }

  if (token) initApp();

  function openTrain() {
    fetch('/api/bot/knowledge', { headers: { 'Authorization': `Bearer ${token}` } })
      .then(r => r.json())
      .then(data => {
        document.getElementById('trainPrompt').value = data.prompt || '';
        document.getElementById('trainModal').style.display = 'flex';
      });
  }

  function closeTrain() {
    document.getElementById('trainModal').style.display = 'none';
  }

  async function saveTrain() {
    const prompt = document.getElementById('trainPrompt').value;
    const res = await fetch('/api/bot/knowledge', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ prompt })
    });
    if (res.ok) {
      alert('Бобор обучен новым знаниям!');
      closeTrain();
    } else {
      alert('Ошибка обучения');
    }
  }

  function openSettings() {
    document.getElementById('settingNickname').value = currentUser;
    document.getElementById('settingTheme').value = currentTheme;
    document.getElementById('settingLanguage').value = currentLang;
    document.getElementById('settingsModal').style.display = 'flex';
  }

  function closeSettings() {
    document.getElementById('settingsModal').style.display = 'none';
  }

  async function saveSettings() {
    const newNick = document.getElementById('settingNickname').value;
    const newTheme = document.getElementById('settingTheme').value;
    const newLang = document.getElementById('settingLanguage').value;

    const res = await fetch('/api/user/settings', {
      method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
      body: JSON.stringify({ username: newNick, theme: newTheme, language: newLang })
    });
    const data = await res.json();
    
    if (res.ok) {
      localStorage.setItem('token', data.token);
      localStorage.setItem('username', data.username);
      localStorage.setItem('theme', data.theme);
      localStorage.setItem('language', data.language);
      location.reload();
    } else { alert(data.error); }
  }

  async function loadChats() {
    const res = await fetch('/api/chats', { headers: { 'Authorization': `Bearer ${token}` } });
    const chats = await res.json();
    const list = document.getElementById('chatList');
    list.innerHTML = '';
    chats.forEach(chat => {
      const div = document.createElement('div');
      div.className = 'chat-item' + (chat.id === currentChatId ? ' active' : '');
      div.textContent = chat.title || 'Без названия';
      div.onclick = () => openChat(chat.id);
      list.appendChild(div);
    });
  }

  async function createNewChat() {
    const res = await fetch('/api/chats', { method: 'POST', headers: { 'Authorization': `Bearer ${token}` } });
    const data = await res.json();
    currentChatId = data.chatId; loadChats();
    document.getElementById('messages').innerHTML = `
      <div class="msg-row bot">
        <div class="avatar">🦫</div>
        <div class="msg-content">${translations[currentLang].welcome}</div>
      </div>`;
  }

  async function openChat(chatId) {
    currentChatId = chatId; loadChats();
    const res = await fetch(`/api/chats/${chatId}/messages`, { headers: { 'Authorization': `Bearer ${token}` } });
    const msgs = await res.json();
    const container = document.getElementById('messages'); container.innerHTML = '';
    msgs.forEach(m => addMessageToUI(m.content, m.role === 'user' ? 'user' : 'bot', m.image_url));
    container.scrollTop = container.scrollHeight;
  }

  function setMode(mode) {
    currentMode = mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
  }

  function handleFileSelect(event) {
    selectedFile = event.target.files[0];
    if (selectedFile) {
      document.getElementById('messageInput').placeholder = `Выбрано: ${selectedFile.name}`;
      document.getElementById('messageInput').focus();
    }
  }

  async function sendMessage() {
    const input = document.getElementById('messageInput');
    const text = input.value.trim();
    if ((!text && !selectedFile) || !currentChatId) return;

    addMessageToUI(text || '📷 Фото/Видео', 'user');
    
    const formData = new FormData();
    formData.append('message', text); formData.append('mode', currentMode);
    if (selectedFile) formData.append('image', selectedFile);

    input.value = ''; selectedFile = null; document.getElementById('fileInput').value = '';
    input.placeholder = translations[currentLang].placeholder;

    // Показываем анимацию "Думает"
    showTypingIndicator();
    document.getElementById('btnSend').disabled = true;

    try {
      const res = await fetch(`/api/chats/${currentChatId}/message`, {
        method: 'POST', headers: { 'Authorization': `Bearer ${token}` }, body: formData
      });
      const data = await res.json();
      removeTypingIndicator();
      document.getElementById('btnSend').disabled = false;

      if (res.ok) { 
        addMessageToUI(data.reply, 'bot', data.imageUrl); 
        loadChats(); 
      } 
      else { addMessageToUI('Ошибка: ' + data.error, 'bot'); }
    } catch (err) { 
      removeTypingIndicator();
      document.getElementById('btnSend').disabled = false;
      addMessageToUI('Ошибка соединения с сервером', 'bot'); 
    }
  }

  function showTypingIndicator() {
    const container = document.getElementById('messages');
    const row = document.createElement('div');
    row.className = 'msg-row bot';
    row.id = 'typing-row';
    row.innerHTML = `
      <div class="avatar">🦫</div>
      <div class="typing-indicator">
        <span></span><span></span><span></span>
      </div>
    `;
    container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }

  function removeTypingIndicator() {
    const row = document.getElementById('typing-row');
    if (row) row.remove();
  }

  function addMessageToUI(text, sender, imageUrl = null) {
    const container = document.getElementById('messages');
    const row = document.createElement('div'); row.className = `msg-row ${sender}`;
    const avatar = document.createElement('div'); avatar.className = 'avatar'; avatar.textContent = sender === 'user' ? '👤' : '🦫';
    const content = document.createElement('div'); content.className = 'msg-content';
    
    if (text) {
      const textNode = document.createElement('div'); textNode.textContent = text; content.appendChild(textNode);
    }
    if (imageUrl && imageUrl.startsWith('http')) {
      const img = document.createElement('img'); img.src = imageUrl; content.appendChild(img);
    }
    row.appendChild(avatar); row.appendChild(content); container.appendChild(row);
    container.scrollTop = container.scrollHeight;
  }
</script>
</body>
</html>
